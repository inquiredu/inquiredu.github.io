name: Refresh Medium
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: medium-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public stories and publish Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-medium.mjs
