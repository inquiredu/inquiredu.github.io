# Keeps projects.json in step with GitHub topics.
# Tag a repo `catalog` and it appears on the site; remove the tag and it's hidden.
# Runs every hour, and right away when `gh catalog` / `gh uncatalog` asks it to.
name: Sync catalog

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read topics and update projects.json
        id: sync
        env:
          CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
        run: node scripts/sync-catalog.mjs

      - name: Commit and publish
        if: steps.sync.outputs.message != ''
        env:
          MESSAGE: ${{ steps.sync.outputs.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898181+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "$MESSAGE"
          git push
          # Ask Pages to rebuild in case a push from a workflow token doesn't trigger one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
