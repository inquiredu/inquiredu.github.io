# Keeps the catalog in step with GitHub topics.
# Tag a repo `shelf` and it appears on the site; remove the tag and it's hidden.
# Runs every hour, and right away when `gh shelve` / `gh unshelve` asks it to.
# The script writes both files itself (private catalog first, then the public list)
# with the same two keys settings.html uses, so this workflow only needs to read.
name: Sync catalog

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read topics and update the catalog
        env:
          REPO_LIST_KEY: ${{ secrets.REPO_LIST_KEY }}
          PUBLISHING_KEY: ${{ secrets.PUBLISHING_KEY }}
        run: node scripts/sync-catalog.mjs
