# Deploys the studio Worker (auth/) to Cloudflare when its code changes on main,
# so the studio and its Worker never drift apart. Run it by hand from the Actions tab too.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see auth/README.md).
# Until both are set, it skips with a warning instead of failing.
# Worker secrets (GitHub client, OpenAI key) live in Cloudflare and are not touched by a deploy.
name: Deploy studio Worker

on:
  push:
    branches: [main]
    paths:
      - "auth/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the Cloudflare secrets
        id: keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy the Worker. See auth/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Run the tests before deploying
        if: steps.keys.outputs.ready == 'true'
        run: node --test tests/*.test.mjs

      - name: Deploy the Worker
        if: steps.keys.outputs.ready == 'true'
        working-directory: auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.156.2 deploy
